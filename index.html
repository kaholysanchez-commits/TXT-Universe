<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomorrow X Together | Blog MOA</title>
    <!-- Fonte moderna do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* Fundo degradê nas cores do TXT (azul e lilás pastel) */
            background: linear-gradient(135deg, #d4e7fa 0%, #e9d8fd 100%);
            color: #1e293b;
            min-height: 100vh;
            padding: 24px 16px;
        }

        header {
            background: linear-gradient(135deg, #8ab8e6, #ACC8E5);
            color: #ffffff;
            text-align: center;
            max-width: 800px;
            margin: 0 auto 24px auto;
            padding: 32px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(138, 184, 230, 0.35);
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 1px;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.1);
            margin-bottom: 8px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Estilo de cartão para o post */
        .post-card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            gap: 24px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(138, 184, 230, 0.3);
        }

        .post-card img {
            width: 140px;
            height: 140px;
            object-fit: cover; /* Evita que a imagem fique esticada */
            border-radius: 16px;
            border: 4px solid #ACC8E5;
            flex-shrink: 0;
        }

        .post-conteudo {
            text-align: left;
            flex: 1;
        }

        .tag {
            display: inline-block;
            background-color: #e6f0fa;
            color: #3b76b0;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 8px;
        }

        .post-conteudo h2 {
            color: #1e3a5f;
            margin-bottom: 4px;
        }

        .artigo-autor {
            font-weight: 600;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 12px;
        }

        .post-texto {
            line-height: 1.6;
            color: #334155;
            margin-bottom: 16px;
        }

        /* Botão de curtir */
        .btn-like {
            background-color: #fff0f3;
            color: #e11d48;
            border: 2px solid #fecdd3;
            padding: 8px 18px;
            border-radius: 999px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-like:hover {
            background-color: #ffe4e6;
            transform: scale(1.05);
        }

        .btn-like:active {
            transform: scale(0.95);
        }

        footer {
            text-align: center;
            max-width: 800px;
            margin: 32px auto 0 auto;
            color: #475569;
            font-size: 0.85rem;
        }

        /* Ajuste automático para telas de celular */
        @media (max-width: 600px) {
            .post-card {
                flex-direction: column;
                text-align: center;
            }
            .post-conteudo {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>✭ Tomorrow X Together ✭</h1>
        <p>De Moa para Moas ♡</p>
    </header>

    <main>
        <article class="post-card">
            <img src="image1.jpeg" alt="Imagem do TXT">

            <div class="post-conteudo">
                <span class="tag">#TXT • #MOA</span>
                <h2>Meu primeiro post</h2>
                <p class="artigo-autor">Por: Kaholy Sanchez</p>
                <p class="post-texto">Sejam bem-vindas ao meu novo blog do TXT! Aqui vou estar compartilhando informações deles como músicas, vídeos, shows e muito mais ♡.</p>
                <button class="btn-like">❤️ <span>0</span></button>
            </div>
        </article>
    </main>

    <footer>
        <p>Feito com 💙 por Kaholy Sanchez</p>
    </footer>

    <script>
        const botao = document.querySelector(".btn-like");
        botao.addEventListener("click", botaoClicado);

        function botaoClicado() {
            let texto = botao.querySelector("span");
            texto.textContent = Number(texto.textContent) + 1;
        }
    </script>
</body>
</html>
